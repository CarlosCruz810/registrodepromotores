<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asesores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <h2 class="text-2xl font-bold mb-6 text-blue-900 text-center">Registro de Promotores</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">Nombre Completo</label>
                <input type="text" id="nombre" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tu nombre">
            </div>

            <div>
                <label class="block text-sm font-bold mb-1">WhatsApp</label>
                <input type="tel" id="whatsapp_user" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tu número">
            </div>

            <div>
                <label class="block text-sm font-bold mb-1">Programa</label>
                <select id="programa" class="w-full p-3 border rounded-lg bg-white">
                    <option>Bachillerato 22 Semanas</option>
                    <option>Primaria/Secundaria Adultos</option>
                    <option>Inglés y Computación</option>
                </select>
            </div>

            <button onclick="enviarAWhatsApp()" class="w-full bg-green-600 text-white font-bold py-4 rounded-lg hover:bg-green-700 transition shadow-lg">
                ENVIAR POR WHATSAPP
            </button>
        </div>
    </div>

    <script>
        function enviarAWhatsApp() {
            const nombre = document.getElementById('nombre').value;
            const tel = document.getElementById('whatsapp_user').value;
            const prog = document.getElementById('programa').value;

            if(!nombre || !tel) return alert("Por favor completa los datos");

            const miNumero = "529984943352";
            const texto = `*NUEVO REGISTRO*%0A*Nombre:* ${nombre}%0A*Tel:* ${tel}%0A*Programa:* ${prog}`;
            
            window.location.href = `https://wa.me/${miNumero}?text=${texto}`;
        }
    </script>
</body>
</html>
