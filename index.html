<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asesores | Cancún</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-blue-900 mb-2 text-pretty">Registro de Socios</h1>
        <p class="text-center text-gray-500 mb-8 text-sm">Gana $300 como Asesor o $100 por Referido</p>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nombre Completo</label>
                <input type="text" id="nombre_v" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Escribe tu nombre">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Tu WhatsApp</label>
                <input type="tel" id="tel_v" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: 9981234567">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Programa de Interés</label>
                <select id="prog_v" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-white">
                    <option>Bachillerato 22 Semanas</option>
                    <option>Primaria y Secundaria Adultos</option>
                    <option>Inglés y Computación</option>
                    <option>Asistente Educativo</option>
                </select>
            </div>

            <button onclick="enviarWhatsAppDirecto()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transition duration-300 transform active:scale-95 flex items-center justify-center">
                <span class="mr-2">📲</span> REGISTRARME POR WHATSAPP
            </button>
        </div>
        
        <p class="text-center text-[10px] text-gray-400 mt-6 italic">Se abrirá tu WhatsApp para enviarme tus datos al instante.</p>
    </div>

    <script>
        function enviarWhatsAppDirecto() {
            const n = document.getElementById('nombre_v').value;
            const t = document.getElementById('tel_v').value;
            const p = document.getElementById('prog_v').value;

            if(!n || !t) {
                alert("Carlos, por favor pide a tus usuarios que llenen nombre y teléfono.");
                return;
            }

            // TU WHATSAPP PERSONALIZADO
            const numeroDestino = "529987593954";
            
            const mensajeFinal = `*¡NUEVO REGISTRO DE ASESOR!*%0A%0A` +
                                `*Nombre:* ${n}%0A` +
                                `*WhatsApp:* ${t}%0A` +
                                `*Interés:* ${p}%0A%0A` +
                                `_Hola, quiero unirme a tu equipo de ventas._`;

            // Acción directa sin pasar por servidores intermedios
            window.location.href = `https://wa.me/${9987593954}?text=${mensajeFinal}`;
        }
    </script>

</body>
</html>
